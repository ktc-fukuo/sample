<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{common/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{V14Yojitsu.title}">V14_YOJITSU</title>
<style type="text/css">
</style>
<script type="text/javascript">

</script>
<script th:src="@{/model/V14Yojitsu.js}"></script>
<script th:src="@{/model/V14YojitsuGridColumns.js}"></script>
<!-- V14_YOJITSUの参照モデルのグリッド定義 -->
<script th:src="@{/model/T14Koutei.js}"></script>
<script th:src="@{/model/T14KouteiGridColumns.js}"></script>
  <!-- T14_KOUTEIの参照モデルのグリッド定義 -->
  <script th:src="@{/model/MhrUser.js}"></script>
  <script th:src="@{/model/MhrUserGridColumns.js}"></script>
</head>
<body>
  <div layout:fragment="article">
    <h2 th:text="#{V14Yojitsu.h2}">h2</h2>
    <form name="V14YojitsuRegistForm" action="V14YojitsuRegist.ajax" class="regist">
      <fieldset class="view">
        <legend th:text="#{V14Yojitsu.legend}">legend</legend>
        <div id="kouteiId">
          <label for="V14Yojitsu.kouteiId" th:text="#{V14Yojitsu.kouteiId}">KOUTEI_ID</label><input type="text" id="V14Yojitsu.kouteiId" name="V14Yojitsu.kouteiId" maxlength="10" class=" primaryKey refer" />
        </div>
        <div id="kouteiTx">
          <label for="V14Yojitsu.kouteiTx" th:text="#{V14Yojitsu.kouteiTx}">KOUTEI_TX</label>
          <textarea id="V14Yojitsu.kouteiTx" name="V14Yojitsu.kouteiTx"></textarea>
        </div>
        <div id="kaishiYmd">
          <label for="V14Yojitsu.kaishiYmd" th:text="#{V14Yojitsu.kaishiYmd}">KAISHI_YMD</label><input type="text" id="V14Yojitsu.kaishiYmd" name="V14Yojitsu.kaishiYmd" maxlength="10" class="" />

        <div id="shuryoYmd">
          <label for="V14Yojitsu.shuryoYmd" th:text="#{V14Yojitsu.shuryoYmd}">SHURYO_YMD</label><input type="text" id="V14Yojitsu.shuryoYmd" name="V14Yojitsu.shuryoYmd" maxlength="10" class="" />
        </div>
        <div id="sagyokuCd">
          <label for="V14Yojitsu.sagyokuCd" th:text="#{V14Yojitsu.sagyokuCd}">SAGYOKU_CD</label><input type="text" id="V14Yojitsu.sagyokuCd" name="V14Yojitsu.sagyokuCd" maxlength="10" class="" />
        </div>
        <div id="oyaKouteiId">
          <label for="V14Yojitsu.oyaKouteiId" th:text="#{V14Yojitsu.oyaKouteiId}">OYA_KOUTEI_ID</label><input type="text" id="V14Yojitsu.oyaKouteiId" name="V14Yojitsu.oyaKouteiId" maxlength="10" class=" refer" />
        </div>
        <div id="jisshiYmd">
          <label for="V14Yojitsu.jisshiYmd" th:text="#{V14Yojitsu.jisshiYmd}">JISSHI_YMD</label><input type="text" id="V14Yojitsu.jisshiYmd" name="V14Yojitsu.jisshiYmd" maxlength="10" class="" />
        </div>
        <div id="kanryoYmd">
          <label for="V14Yojitsu.kanryoYmd" th:text="#{V14Yojitsu.kanryoYmd}">KANRYO_YMD</label><input type="text" id="V14Yojitsu.kanryoYmd" name="V14Yojitsu.kanryoYmd" maxlength="10" class="" />
        </div>
        <div id="dependencies">
          <label for="V14Yojitsu.dependencies" th:text="#{V14Yojitsu.dependencies}">DEPENDENCIES</label><input type="text" id="V14Yojitsu.dependencies" name="V14Yojitsu.dependencies" maxlength="4000" class="" />
        </div>
        <div id="kouteiPath">
          <label for="V14Yojitsu.kouteiPath" th:text="#{V14Yojitsu.kouteiPath}">KOUTEI_PATH</label><input type="text" id="V14Yojitsu.kouteiPath" name="V14Yojitsu.kouteiPath" maxlength="4000" class="" />
        </div>
        <div id="root">
          <label for="V14Yojitsu.root" th:text="#{V14Yojitsu.root}">ROOT</label><input type="text" id="V14Yojitsu.root" name="V14Yojitsu.root" maxlength="10" class="" />
        </div>
      </fieldset>
      <div class="buttons">
        <a th:href="@{V14YojitsuGet.xlsx(baseMei=#{V14Yojitsu.h2})}" id="V14YojitsuGet.xlsx" th:text="#{common.xlsx}" class="output" tabindex="-1">xlsx</a>
      </div>
      <div class="submits">
      </div>
    </form>
  </div>
</body>
</html>
